name: C build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_mixer
      - name: Build Windows executable
        run: mingw32-make OS=Windows_NT
      - uses: actions/upload-artifact@v4
        with:
          name: dofus-arena-windows-x64
          path: dofus-arena.exe

      - name: Attach Windows executable to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dofus-arena.exe
          fail_on_unmatched_files: true

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libsdl2-mixer-dev
      - name: Build Linux executable
        run: make
      - name: Check sprite selector syntax
        run: python3 -m py_compile tools/sprite_frame_selector.py
      - uses: actions/upload-artifact@v4
        with:
          name: dofus-arena-linux-x64
          path: dofus-arena

      - name: Attach Linux executable to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dofus-arena
          fail_on_unmatched_files: true
